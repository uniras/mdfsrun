[project]
name = "mdfsrun"
version = "0.1.1"
description = "Run a front-matter Markdown file: tangle its code blocks with Entangled and run its front matter as a Taskfile"
readme = "README.md"
requires-python = ">=3.13"  # required by entangled-cli 2.4.x
license = "MIT"
license-files = ["LICENSE"]
keywords = ["markdown", "literate-programming", "entangled", "taskfile", "pep723", "uv"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "go-task-bin",
    "entangled-cli",
]

[project.urls]
Homepage = "https://github.com/uniras/mdfsrun"
Repository = "https://github.com/uniras/mdfsrun"
